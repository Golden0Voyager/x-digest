name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check *.py pipeline/

      - name: Run mypy
        run: uv run mypy *.py || true
      - name: Run security scan (bandit)
        run: uv tool run bandit -r . || true

      - name: Audit dependencies
        # The old step ran `uv audit` for real (uv >= 0.11) but `|| true` turned
        # every advisory into a green build. This gate reads the frozen lock, so
        # CI cannot disagree with uv.lock.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off \
            --ignore-vuln PYSEC-2026-4114
        # PYSEC-2026-4114 (oauthlib 3.3.1, timing attack on the PKCE code_verifier
        # comparison) is fixed only in oauthlib 4.0.0, and oauthlib cannot reach
        # 4.0.0 here: tweepy requires `oauthlib>=3.2.0,<4`, so the resolver refuses
        # (`uv lock --upgrade-package oauthlib==4.0.0` -> unsatisfiable). Impact is
        # limited to running an OAuth provider: the affected code paths are
        # oauthlib's RevocationEndpoint and PKCE verification, and this project
        # only uses oauthlib transitively for outbound API signing — it never
        # imports tweepy at all. Revisit when tweepy allows oauthlib 4.x, or drop
        # tweepy.


      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --ignore=tests/test_translate_models.py tests/ 2>/dev/null || echo "No pytest tests found"

      - name: Enforce coverage threshold
        run: uv run coverage report
