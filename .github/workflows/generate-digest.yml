name: Generate X-Digest

on:
  workflow_dispatch:      # 允许手动触发执行
  workflow_run:
    workflows: ["Fetch Tweets"]
    types: [completed]

concurrency:
  group: generate-x-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-digest:
    # 抓取被取消/失败时不生成摘要，避免空数据误报
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

        # 不钉 version：让 CI 始终装最新 uv；太旧的版本由 pyproject.toml 的 required-version 下限挡住

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Restore fetched tweets
        run: |
          set -euo pipefail
          git fetch --depth=1 origin auto-docs
          mkdir -p output
          # auto-docs 同时存在 output/ 和旧版嵌套的 output/output/，取最新的那份
          git show origin/auto-docs:output/raw_tweets_pool.json > /tmp/pool_top.json 2>/dev/null || true
          git show origin/auto-docs:output/output/raw_tweets_pool.json > /tmp/pool_nested.json 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path

          best = None
          for path in (Path("/tmp/pool_top.json"), Path("/tmp/pool_nested.json")):
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text())
              except (ValueError, OSError):
                  continue
              if not isinstance(data, dict) or not data:
                  continue
              latest = max((t.get("created_at", "") for t in data.values() if isinstance(t, dict)), default="")
              if best is None or latest > best[0]:
                  best = (latest, data)

          if best is None:
              print("⚠️ auto-docs 上没有可用的推文池")
          else:
              Path("output/raw_tweets_pool.json").write_text(json.dumps(best[1], ensure_ascii=False))
              print(f"✓ 恢复推文池 {len(best[1])} 条（最新 {best[0]}）")
          PY

          mkdir -p output/intermediate
          for f in jev_scores.json translations.json insights.json; do
            if git show "origin/auto-docs:output/intermediate/$f" > "output/intermediate/$f" 2>/dev/null; then
              echo "✓ 恢复 output/intermediate/$f"
            else
              rm -f "output/intermediate/$f"
            fi
          done

      - name: Run digest pipeline
        env:
          # AI 管线配置
          AI_PROVIDER_CHAIN: SENSENOVA,SILICONFLOW,GROQ,OPENROUTER
          AI_MODEL: DeepSeek-V3-1
          AI_MODEL_TRANSLATE: deepseek-v4-flash
          AI_MODEL_INSIGHTS: deepseek-v4-flash
          AI_BATCH_SIZE_TP: 30

          # 供应商 BASE_URL（防止 CI 上空字符串导致 Connection error）
          SENSENOVA_BASE_URL: https://api.sensenova.cn/compatible-mode/v2
          SENSENOVA_TP_BASE_URL: https://token.sensenova.cn/v1
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
          GROQ_BASE_URL: https://api.groq.com/openai/v1
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1

          # 飞书与 API Keys
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          # Token Plan 凭据留空时自动复用 SENSENOVA_API_KEY
          SENSENOVA_TP_API_KEY: ${{ secrets.SENSENOVA_TP_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_DEFAULT_MODEL: jev-latest
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run python main.py --pipeline-only --hours 24 --no-pdf

      - name: Commit to auto-docs
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          mkdir -p /tmp/auto-docs-save
          cp -r output/. /tmp/auto-docs-save/

          git fetch --depth=50 origin auto-docs 2>/dev/null || true
          if git rev-parse --verify origin/auto-docs 2>/dev/null; then
            git checkout -B _docs origin/auto-docs
          else
            git checkout --orphan _docs
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p output
          cp -r /tmp/auto-docs-save/. output/

          git add -f output/
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit"
          else
            git commit -m "📝 Auto Digest: $(date +'%Y-%m-%d') [skip ci]"
            for attempt in 1 2 3; do
              if git push origin _docs:auto-docs; then
                echo "Push succeeded on attempt ${attempt}"
                exit 0
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: Notify on failure
        if: failure() && env.FEISHU_WEBHOOK_URL
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          curl -X POST "${FEISHU_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"❌ X-Digest generate-digest 运行失败\n运行ID: ${{ github.run_id }}\n链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
