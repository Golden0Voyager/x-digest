name: Daily X-Digest

on:
  schedule:
    - cron: '0 7 * * *'  # 每天北京时间下午 3:00 运行 (UTC 07:00)
  workflow_dispatch:      # 允许手动触发执行

jobs:
  run-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium

      - name: Prepare Twitter cookies
        run: |
          if [ -n "${{ secrets.X_COOKIES_1 }}" ]; then
            echo "${{ secrets.X_COOKIES_1 }}" | base64 -d > x_cookies_1.json
          fi
          if [ -n "${{ secrets.X_COOKIES_2 }}" ]; then
            echo "${{ secrets.X_COOKIES_2 }}" | base64 -d > x_cookies_2.json
          fi
          if [ -n "${{ secrets.X_COOKIES_3 }}" ]; then
            echo "${{ secrets.X_COOKIES_3 }}" | base64 -d > x_cookies_3.json
          fi

      - name: Run x-digest pipeline
        env:
          # AI 管线配置
          AI_PROVIDER_CHAIN: SENSENOVA,SILICONFLOW,GROQ,OPENROUTER
          AI_MODEL_TRANSLATE: DeepSeek-R1
          AI_MODEL_INSIGHTS: DeepSeek-R1
          
          # 飞书与 API Keys
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run main.py

      - name: Commit and push generated digests
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📝 Auto Digest: $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
