[project]
name = "x-digest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "markdown>=3.10.2",
    "openai>=2.21.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "python-dotenv>=1.2.1",
    "questionary>=2.1.1",
    "tenacity>=9.1.4",
    "tweepy>=4.16.0",
    "twikit>=2.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E701", "E722", "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM115", "SIM118", "N806", "B007", "B905", "F841"]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]
